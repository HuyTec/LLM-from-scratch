seed = 42

[data]
raw_path = "data/raw/tiny_shakespeare.txt"
processed_dir = "data/processed"
train_fraction = 0.9

[tokenizer]
kind = "character"
unknown_token = "<unk>"

[model]
d_model = 128
context = 64
n_layers = 2
n_heads = 4

[training]
device = "cpu"
batch_size = 8
learning_rate = 0.0003
max_steps = 500
eval_every = 50
run_root = "runs"
